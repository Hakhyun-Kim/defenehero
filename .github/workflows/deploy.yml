name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# GitHub Pages 배포 권한 설정
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # GitHub Secrets 의 키를 analytics.config.js 로 주입 (키가 없으면 수집 꺼진 채로 빌드)
      - name: Inject Analytics Secrets
        env:
          GA_GAME_KEY: ${{ secrets.GA_GAME_KEY }}
          GA_SECRET_KEY: ${{ secrets.GA_SECRET_KEY }}
        run: node scripts/write-analytics-config.mjs

      - name: Build Web Application
        run: npm run build

      # www/ 만 배포한다 — 루트를 통째로 올리면 src/analytics.config.js 와 android/ 까지 공개된다
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
